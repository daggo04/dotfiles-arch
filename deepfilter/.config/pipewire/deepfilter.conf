# DeepFilterNet mic noise suppression for the Arctis Nova Pro, run as its OWN
# PipeWire process by deepfilter.service (`pipewire -c deepfilter.conf`).
#
# Why not a drop-in in pipewire.conf.d: the plugin panics when it falls behind
# realtime under heavy CPU load (games), and a panic inside the main pipewire
# process aborts the whole audio server -> every app loses sound, AoE2 crashed
# mid-match (2026-11-10). Out here a panic only kills this process; systemd
# restarts it and WirePlumber moves the mic to the raw Arctis source meanwhile.
#
# Toggle with `deepfilter on|off|toggle` (sidebar mic button, rofi Commands).

context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        args = { }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }

    { name = libpipewire-module-filter-chain
        args = {
            node.description = "DeepFilter Arctis Nova Mono"
            media.name        = "DeepFilter Arctis Nova Mono"
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = deepfilter_arctis
                        plugin = libdeep_filter_ladspa
                        label  = deep_filter_mono
                        control = {
                            "Attenuation Limit (dB)" = 100
                            # Slack against CPU spikes before it underruns.
                            # Each frame is ~10 ms of extra mic latency.
                            "Min Processing Buffer (frames)" = 4
                            # Skip the expensive DF stage on loud (already clean)
                            # speech. Default 35; the panic message itself says
                            # to lower this.
                            "Max DF processing threshold (dB)" = 20
                        }
                    }
                ]
            }
            capture.props = {
                node.name   = "capture.deepfilter_arctis"
                node.passive = true
                audio.rate  = 48000
                node.target = "alsa_input.usb-SteelSeries_Arctis_Nova_Pro_Wireless-00.mono-fallback"
            }
            playback.props = {
                node.name   = "playback.deepfilter_arctis"
                media.class = Audio/Source
                audio.rate  = 48000
            }
        }
    }
]
