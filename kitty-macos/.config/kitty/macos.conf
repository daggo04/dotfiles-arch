# macOS-only kitty overrides (layered on top of the shared kitty.conf)

# Left Option acts as Alt (Meta) so shell word-nav / alt+tab binds feel right;
# right Option stays free for typing accented characters.
macos_option_as_alt left

# Titlebar matches the Monokai Octagon background instead of the grey default.
macos_titlebar_color background

# Cmd+Q / closing the last window quits kitty, like a native mac app.
macos_quit_when_last_window_closed yes

# The shared config already sets background_opacity 0.85; add mac-native blur
# behind it so the translucency looks intentional rather than washed out.
background_blur 32
