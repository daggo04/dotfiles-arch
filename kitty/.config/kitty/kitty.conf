# Font
font_family      FiraCode Nerd Font
font_size        12.0

# Monokai Pro Octagon Color Scheme
foreground       #eaf2f1
background       #282a3a

# Cursor
cursor           #ff657a
cursor_text_color #282a3a

# Selection
selection_foreground #282a3a
selection_background #ff657a

# URL
url_color        #9cd1bb

# Black
color0   #282a3a
color8   #696d77

# Red
color1   #ff657a
color9   #ff657a

# Green
color2   #bad761
color10  #bad761

# Yellow
color3   #ffd76d
color11  #ffd76d

# Blue
color4   #9cd1bb
color12  #9cd1bb

# Magenta
color5   #c39ac9
color13  #c39ac9

# Cyan
color6   #9cd1bb
color14  #9cd1bb

# White
color7   #eaf2f1
color15  #eaf2f1

# Window
background_opacity 0.85
window_padding_width 8

# Layouts — `splits` enables on-demand vsplit/hsplit (tmux-style panes);
# `stack` is a zoom layout (show one pane fullscreen). Cycle with ctrl+shift+l.
# splits is listed first, so it's the default layout for new tabs.
enabled_layouts splits,stack

# Tab bar
tab_bar_style powerline
active_tab_foreground   #282a3a
active_tab_background   #ff657a
inactive_tab_foreground #b2b9bd
inactive_tab_background #1e1f2b

# ── Hints kitten ──────────────────────────────────────────────
# Press the hotkey, every match on screen gets a letter label,
# type the label to act on it. Reload config with ctrl+shift+f5.

# kitty_mod is a variable; its default is ctrl+shift. Using it (instead of
# hardcoding ctrl+shift) keeps these in sync if you ever rebind kitty_mod,
# and merges them cleanly into kitty's stock kitty_mod+p prefix menu.
# (kitty already binds kitty_mod+e = hints and kitty_mod+p>{d,l,shift+f,y};
#  the letters below add to / override that same prefix.)

# n → open a file:line reference (e.g. src/foo.rs:42) in Neovim at that line, in a new tab
map kitty_mod+p>n kitten hints --type linenum --linenum-action=tab nvim +{line} {path}

# f → insert a file path into the terminal at the cursor (great for `nvim <path>`)
map kitty_mod+p>f kitten hints --type path --program -

# c → copy a file path to the clipboard
map kitty_mod+p>c kitten hints --type path --program @

# h → copy a git hash / sha to the clipboard
map kitty_mod+p>h kitten hints --type hash --program @

# w → copy any word on screen to the clipboard
map kitty_mod+p>w kitten hints --type word --program @

# ── Pane cycling ──────────────────────────────────────────────
# alt+tab / alt+shift+tab cycle through panes (windows) in order.
# Hyprland doesn't grab alt+tab, so kitty is free to use it.
# NOTE: repurposed from tab-cycling — tabs no longer have a cycle key.
# Want one back? e.g.  map ctrl+tab next_tab  /  map ctrl+shift+tab previous_tab
map alt+tab        next_window
map alt+shift+tab  previous_window

# Rename the current window/pane (mirrors kitty_mod+alt+t for tabs).
# Pops a prompt; the name you type pins the window title (used for --match).
map kitty_mod+alt+w set_window_title

# Force a redraw of a mangled TUI (e.g. Claude Code) by sending SIGWINCH —
# the same signal a resize sends, so the app repaints a fresh frame, but
# without actually resizing or touching scrollback. The "un-mangle" key.
map kitty_mod+alt+r signal_child SIGWINCH

# ── Splits (tmux-style panes) ─────────────────────────────────
# Needs the `splits` layout (set in enabled_layouts above).
# --cwd=current opens the new pane in the same directory as the focused one.
# Mirrors the Windows Terminal convention:
#   +  → vertical split   (new pane to the RIGHT, divider runs vertically)
#   -  → horizontal split  (new pane BELOW,        divider runs horizontally)
# `plus`/`minus` are kitty's names for these keys — you can't write a literal
# `+`, since it's the modifier separator. NOTE: this overrides kitty's stock
# kitty_mod+plus / kitty_mod+minus font-zoom; zoom still works on the numpad
# (ctrl+shift+kp_add / kp_subtract).
map kitty_mod+plus  launch --location=vsplit --cwd=current
map kitty_mod+minus launch --location=hsplit --cwd=current

# ── Move focus between panes ──────────────────────────────────
# ctrl+shift+arrows jump to the neighbouring pane in that direction.
# These override kitty's stock ctrl+shift+left/right (switch tab) and
# ctrl+shift+up/down (scroll one line). alt+tab cycles panes too (below).
# Panes also still cycle with the stock ctrl+shift+] and ctrl+shift+[.
# Resize the focused pane with the stock ctrl+shift+r.
map kitty_mod+left  neighboring_window left
map kitty_mod+right neighboring_window right
map kitty_mod+up    neighboring_window up
map kitty_mod+down  neighboring_window down

# ── Command palette (VSCode-style) ────────────────────────────
# Fuzzy-searchable list of EVERY kitty action + its keybinding.
# Type to filter, Enter to run. Also a cheat-sheet for your binds.
map kitty_mod+space command_palette

# ── Remote control ────────────────────────────────────────────
# Lets `kitten @` (and Claude Code) drive this kitty over a socket:
# read scrollback, launch tabs, send input, change colors live, etc.
# socket-only = control ONLY via the socket below, not via screen
# escape codes, so stray program output can't hijack the terminal.
# NOTE: read only at startup — a config reload won't open the socket;
# you must fully quit and relaunch kitty for this to take effect.
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}

# ── Links ─────────────────────────────────────────────────────
# Clicked links (and kitten hints) go to url-pick: a tiny rofi menu at the
# mouse to choose the browser. Non-http links go straight to xdg-open.
# macos.conf resets this to `default` (the script is Linux-only).
open_url_with ~/.local/bin/url-pick

# Ctrl+click opens links (kitty's stock binds are plain click and ctrl+shift+click).
# Works in mouse-grabbing apps too (nvim, Claude Code); the press is swallowed
# so it doesn't start a selection or reach the app.
mouse_map ctrl+left press grabbed,ungrabbed discard_event
mouse_map ctrl+left release grabbed,ungrabbed mouse_handle_click link

# ── Misc ──────────────────────────────────────────────────────
confirm_os_window_close 0

# ── Per-OS overrides ──────────────────────────────────────────
# globinclude silently no-ops when the file is absent (i.e. on Linux),
# so this line is safe to share across machines. On macOS the
# kitty-macos Stow package provides macos.conf.
globinclude macos.conf
