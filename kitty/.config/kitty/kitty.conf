# Font
font_family      FiraCode Nerd Font
font_size        12.0

# Monokai Pro Octagon Color Scheme
foreground       #eaf2f1
background       #282a3a

# Cursor
cursor           #ff657a
cursor_text_color #282a3a

# Selection
selection_foreground #282a3a
selection_background #ff657a

# URL
url_color        #9cd1bb

# Black
color0   #282a3a
color8   #696d77

# Red
color1   #ff657a
color9   #ff657a

# Green
color2   #bad761
color10  #bad761

# Yellow
color3   #ffd76d
color11  #ffd76d

# Blue
color4   #9cd1bb
color12  #9cd1bb

# Magenta
color5   #c39ac9
color13  #c39ac9

# Cyan
color6   #9cd1bb
color14  #9cd1bb

# White
color7   #eaf2f1
color15  #eaf2f1

# Window
background_opacity 0.85
window_padding_width 8

# Tab bar
tab_bar_style powerline
active_tab_foreground   #282a3a
active_tab_background   #ff657a
inactive_tab_foreground #b2b9bd
inactive_tab_background #1e1f2b

# ── Hints kitten ──────────────────────────────────────────────
# Press the hotkey, every match on screen gets a letter label,
# type the label to act on it. Reload config with ctrl+shift+f5.

# kitty_mod is a variable; its default is ctrl+shift. Using it (instead of
# hardcoding ctrl+shift) keeps these in sync if you ever rebind kitty_mod,
# and merges them cleanly into kitty's stock kitty_mod+p prefix menu.
# (kitty already binds kitty_mod+e = hints and kitty_mod+p>{d,l,shift+f,y};
#  the letters below add to / override that same prefix.)

# n → open a file:line reference (e.g. src/foo.rs:42) in Neovim at that line, in a new tab
map kitty_mod+p>n kitten hints --type linenum --linenum-action=tab nvim +{line} {path}

# f → insert a file path into the terminal at the cursor (great for `nvim <path>`)
map kitty_mod+p>f kitten hints --type path --program -

# c → copy a file path to the clipboard
map kitty_mod+p>c kitten hints --type path --program @

# h → copy a git hash / sha to the clipboard
map kitty_mod+p>h kitten hints --type hash --program @

# w → copy any word on screen to the clipboard
map kitty_mod+p>w kitten hints --type word --program @

# ── Tab navigation ────────────────────────────────────────────
# alt+tab / alt+shift+tab cycle through kitty tabs (the bottom bar).
# Hyprland doesn't grab alt+tab, so kitty is free to use it.
map alt+tab        next_tab
map alt+shift+tab  previous_tab

# Rename the current window/pane (mirrors kitty_mod+alt+t for tabs).
# Pops a prompt; the name you type pins the window title (used for --match).
map kitty_mod+alt+w set_window_title

# Force a redraw of a mangled TUI (e.g. Claude Code) by sending SIGWINCH —
# the same signal a resize sends, so the app repaints a fresh frame, but
# without actually resizing or touching scrollback. The "un-mangle" key.
map kitty_mod+alt+r signal_child SIGWINCH

# ── Command palette (VSCode-style) ────────────────────────────
# Fuzzy-searchable list of EVERY kitty action + its keybinding.
# Type to filter, Enter to run. Also a cheat-sheet for your binds.
map kitty_mod+space command_palette

# ── Remote control ────────────────────────────────────────────
# Lets `kitten @` (and Claude Code) drive this kitty over a socket:
# read scrollback, launch tabs, send input, change colors live, etc.
# socket-only = control ONLY via the socket below, not via screen
# escape codes, so stray program output can't hijack the terminal.
# NOTE: read only at startup — a config reload won't open the socket;
# you must fully quit and relaunch kitty for this to take effect.
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}

# ── Misc ──────────────────────────────────────────────────────
confirm_os_window_close 0

# ── Per-OS overrides ──────────────────────────────────────────
# globinclude silently no-ops when the file is absent (i.e. on Linux),
# so this line is safe to share across machines. On macOS the
# kitty-macos Stow package provides macos.conf.
globinclude macos.conf
