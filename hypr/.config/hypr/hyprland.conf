
# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# EDIT THIS CONFIG ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################


# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor = DP-2, 3440x1440@180, auto, auto


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = kitty -e yazi
$menu = pkill rofi || rofi -show drun


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
exec-once = waybar
exec-once = cd ~/.config/ags && ags run .
exec-once = hyprsunset
exec-once = hypridle
exec-once = wl-paste --watch cliphist store
exec-once = mpvpaper -p -o "no-audio loop" DP-2 ~/Wallpapers/firewatch-rainy-day-moewalls-com.mp4
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_STYLE_OVERRIDE,kvantum


###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

permission = /usr/(bin|local/bin)/grim, screencopy, allow
permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 3
    gaps_out = 8

    border_size = 2

    col.active_border = rgba(ff657aee)
    col.inactive_border = rgba(3a3d4baa)

    resize_on_border = true

    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    active_opacity = 0.85
    inactive_opacity = 0.75

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(161821cc)
    }

    blur {
        enabled = true
        size = 5
        passes = 3
        new_optimizations = true
        vibrancy = 0.2
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Smooth bezier with slight overshoot
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = smoothSlide, 0.25, 1, 0.5, 1
    bezier = bounceSlide, 0.2, 1.1, 0.4, 1.0

    # Windows pop in/out
    animation = windows,            1, 5, myBezier, popin 80%
    animation = windowsOut,         1, 5, myBezier, popin 80%

    # Layers (rofi, waybar) fade; sidebar overridden via layerrule
    animation = layers,             1, 5, myBezier, fade
    animation = layersIn,           1, 5, bounceSlide, fade
    animation = layersOut,          1, 5, myBezier, fade

    animation = fade,               1, 5, myBezier

    # Workspaces slide horizontally
    animation = workspaces,         1, 3, smoothSlide, slide

    # Special workspaces fade
    animation = specialWorkspaceIn, 1, 5, myBezier, fade
    animation = specialWorkspaceOut,1, 5, myBezier, fade
}

# ── Layer rules ─────────────────────────────────────
layerrule = animation slide right, match:namespace sidebar
layerrule = animation slide right, match:namespace notification-popup

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule {
#     name = no-gaps-wtv1
#     match:float = false
#     match:workspace = w[tv1]
#
#     border_size = 0
#     rounding = 0
# }
#
# windowrule {
#     name = no-gaps-f1
#     match:float = false
#     match:workspace = f[1]
#
#     border_size = 0
#     rounding = 0
# }

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
# Float utility windows
windowrule = match:class pulsemixer, float on, size 800 500, center on
windowrule = match:class nmtui, float on, size 800 700, center on
windowrule = match:class nm-connection-editor, float on, size 600 400, center on
windowrule = match:class nwg-look, float on, center on
windowrule = match:class updater, float on, size 800 600, center on
windowrule = match:class steam_app_335300 title:DARK SOULS II, float on, size 3440 1440, move 0 0
windowrule = match:class steam_app_335300 title:Flawless, float on, center on

dwindle {
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    vrr = 1
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = no
    kb_variant = nodeadkeys
    kb_model = pc105
    kb_options =
    kb_rules =

    follow_mouse = 1


    touchpad {
        natural_scroll = false
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

device {
    name = sony-interactive-entertainment-dualsense-edge-wireless-controller-touchpad
    enabled = false
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bindd = $mainMod, Return, Open terminal, exec, $terminal
bindd = $mainMod, Q, Close active window, killactive,
bindd = ALT, F4, Close active window, killactive,
bindd = $mainMod SHIFT, M, Logout menu, exec, wlogout
bindd = $mainMod SHIFT, L, Lock screen, exec, hyprlock
bindd = SHIFT, F13, Toggle DualSense touchpad, exec, dualsense-touchpad-toggle
bindd = $mainMod, E, Open file manager, exec, $fileManager
bindd = $mainMod SHIFT, right, Toggle floating window, togglefloating,
bindd = $mainMod, space, App launcher, exec, $menu
bindd = $mainMod, V, Clipboard history, exec, pkill rofi || cliphist list | rofi -dmenu -p "󰅌" | cliphist decode | wl-copy
bindd = $mainMod, N, Toggle AGS sidebar, exec, ags toggle sidebar
bindd = $mainMod SHIFT, K, Show keybinds cheatsheet, exec, pkill rofi || rofi -show keybinds
bindd = $mainMod SHIFT, left, Toggle pseudo-tile, pseudo, # dwindle
bindd = $mainMod SHIFT, up, Toggle split direction, layoutmsg, togglesplit # dwindle
bindd = $mainMod SHIFT, down, Toggle split direction, layoutmsg, togglesplit # dwindle

# Resize with mainMod + arrow keys
bindde = $mainMod, right, Resize window wider, resizeactive, 30 0
bindde = $mainMod, left, Resize window narrower, resizeactive, -30 0
bindde = $mainMod, up, Resize window shorter, resizeactive, 0 -30
bindde = $mainMod, down, Resize window taller, resizeactive, 0 30

# Move focus with mainMod + vim keys
bindd = $mainMod, h, Focus window left, movefocus, l
bindd = $mainMod, l, Focus window right, movefocus, r
bindd = $mainMod, k, Focus window up, movefocus, u
bindd = $mainMod, j, Focus window down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bindd = $mainMod, 1, Go to workspace 1, workspace, 1
bindd = $mainMod, 2, Go to workspace 2, workspace, 2
bindd = $mainMod, 3, Go to workspace 3, workspace, 3
bindd = $mainMod, 4, Go to workspace 4, workspace, 4
bindd = $mainMod, 5, Go to workspace 5, workspace, 5
bindd = $mainMod, 6, Go to workspace 6, workspace, 6
bindd = $mainMod, 7, Go to workspace 7, workspace, 7
bindd = $mainMod, 8, Go to workspace 8, workspace, 8
bindd = $mainMod, 9, Go to workspace 9, workspace, 9
bindd = $mainMod, 0, Go to workspace 10, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bindd = $mainMod SHIFT, 1, Move window to workspace 1, movetoworkspace, 1
bindd = $mainMod SHIFT, 2, Move window to workspace 2, movetoworkspace, 2
bindd = $mainMod SHIFT, 3, Move window to workspace 3, movetoworkspace, 3
bindd = $mainMod SHIFT, 4, Move window to workspace 4, movetoworkspace, 4
bindd = $mainMod SHIFT, 5, Move window to workspace 5, movetoworkspace, 5
bindd = $mainMod SHIFT, 6, Move window to workspace 6, movetoworkspace, 6
bindd = $mainMod SHIFT, 7, Move window to workspace 7, movetoworkspace, 7
bindd = $mainMod SHIFT, 8, Move window to workspace 8, movetoworkspace, 8
bindd = $mainMod SHIFT, 9, Move window to workspace 9, movetoworkspace, 9
bindd = $mainMod SHIFT, 0, Move window to workspace 10, movetoworkspace, 10

# Scratchpad
bindd = $mainMod, S, Toggle scratchpad, togglespecialworkspace, magic
bindd = $mainMod SHIFT, S, Move window to scratchpad, movetoworkspace, special:magic

# Spotify scratchpad
bindd = $mainMod, M, Toggle Spotify scratchpad, togglespecialworkspace, spotify

# Obsidian scratchpad
bindd = $mainMod, O, Toggle Obsidian scratchpad, togglespecialworkspace, obsidian

# Scroll through existing workspaces with mainMod + scroll
bindd = $mainMod, mouse_down, Next workspace, workspace, e+1
bindd = $mainMod, mouse_up, Previous workspace, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
binddm = $mainMod, mouse:272, Move window (drag), movewindow
binddm = $mainMod, mouse:273, Resize window (drag), resizewindow

# Copy/paste on Shift + mouse side buttons (adapts for kitty)
bindd = SHIFT, mouse:275, Copy (smart), exec, if [ "$(hyprctl activewindow -j | grep -o '"class": "[^"]*"' | head -1)" = '"class": "kitty"' ]; then wtype -M shift -M ctrl c -m ctrl -m shift; else wtype -M ctrl c -m ctrl; fi
bindd = SHIFT, mouse:276, Paste (smart), exec, if [ "$(hyprctl activewindow -j | grep -o '"class": "[^"]*"' | head -1)" = '"class": "kitty"' ]; then wtype -M shift -M ctrl v -m ctrl -m shift; else wtype -M ctrl v -m ctrl; fi

# Laptop multimedia keys for volume and LCD brightness
binddel = ,XF86AudioRaiseVolume, Volume up, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
binddel = ,XF86AudioLowerVolume, Volume down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binddel = ,XF86AudioMute, Mute output, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
binddel = ,XF86AudioMicMute, Mute microphone, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
binddel = ,XF86MonBrightnessUp, Brightness up, exec, brightnessctl -e4 -n2 set 5%+
binddel = ,XF86MonBrightnessDown, Brightness down, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
binddl = , XF86AudioNext, Next track, exec, playerctl next
binddl = , XF86AudioPause, Play/pause, exec, playerctl play-pause
binddl = , XF86AudioPlay, Play/pause, exec, playerctl play-pause
binddl = , XF86AudioPrev, Previous track, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

# Spotify scratchpad
windowrule {
    name = spotify-scratchpad
    match:class = ^(Spotify)$

    workspace = special:spotify silent
    float = yes
    size = 2060 860
    center = yes
}

exec-once = spotify-launcher

# Obsidian scratchpad
windowrule {
    name = obsidian-scratchpad
    match:class = ^(obsidian)$

    workspace = special:obsidian silent
    float = yes
    size = 2060 860
    center = yes
}

exec-once = obsidian

# Screenshots (grim + slurp + satty)
bindd = , Print, Screenshot region, exec, grim -g "$(slurp)" - | satty -f -
bindd = SHIFT, Print, Screenshot full screen, exec, grim - | satty -f -

# Dictation - toggle (second call signals running instance to stop)
bindd = , XF86Launch7, Speech-to-text, exec, dictation
